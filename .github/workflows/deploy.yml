name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos minimos: solo lo que hace falta para publicar en Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Si se empujan dos commits seguidos, que gane el ultimo sin cancelar
# un despliegue a medias.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # El juego vive en el submodulo game/.
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pygbag convierte a ogg con ffmpeg cualquier audio que no sea apto para
      # web, y aborta el build si no lo encuentra. Sin esto, un dia que el
      # juego incorpore sonido fallaria solo aqui y no en local.
      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Instalar pygbag
        run: pip install pygbag==0.9.3

      - name: Compilar a WebAssembly
        run: python build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
